name: CI / Production Readiness Pipeline

on:
  push:
    branches: [ "main", "Main" ]
  pull_request:
    branches: [ "main", "Main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # =========================================================================
  # 1. BUILD SOLUTION
  # =========================================================================
  build:
    name: Build Solution (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore backend/MedicalPortal.sln

      - name: Build Solution (Release)
        run: dotnet build backend/MedicalPortal.sln --configuration Release --no-restore

  # =========================================================================
  # 2. FULL AUTOMATED TEST SUITE (COMPLETE CHECKOUT REQUIRED CHECK)
  # =========================================================================
  test:
    name: Full Test Suite (.NET 8 - Complete Checkout)
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: medical_portal_test
          POSTGRES_USER: portal_bootstrap
          POSTGRES_PASSWORD: ci-bootstrap-password-generated-for-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_bootstrap -d medical_portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Source Code (Complete Checkout)
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore backend/MedicalPortal.sln

      - name: Create PostgreSQL runtime roles
        env:
          PGPASSWORD: ci-bootstrap-password-generated-for-test
        run: |
          psql --host localhost --username portal_bootstrap --dbname medical_portal_test --command "CREATE ROLE portal_owner LOGIN NOSUPERUSER BYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD 'ci-owner-password-generated-for-test';"
          psql --host localhost --username portal_bootstrap --dbname medical_portal_test --command "CREATE ROLE portal_app LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD 'ci-app-password-generated-for-test';"
          psql --host localhost --username portal_bootstrap --dbname medical_portal_test --command "ALTER DATABASE medical_portal_test OWNER TO portal_owner;"

      - name: Apply migrations as portal_owner
        env:
          POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=medical_portal_test;Username=portal_owner;Password=ci-owner-password-generated-for-test
          JWT_SECRET: ThisIsACISecretKeyWithAtLeast32BytesLength1234567!
          ASPNETCORE_ENVIRONMENT: Development
        run: dotnet run --project backend/src/MedicalPortal.Web/MedicalPortal.Web.csproj --configuration Release -- --migrate

      - name: Run Full Unit & Integration Test Suite with Coverage
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medical_portal_test
          POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=medical_portal_test;Username=portal_app;Password=ci-app-password-generated-for-test
          PORTAL_APP_PASSWORD: ci-app-password-generated-for-test
          REDIS_CONNECTION_STRING: localhost:6379
          JWT_SECRET: ThisIsACISecretKeyWithAtLeast32BytesLength1234567!
          ASPNETCORE_ENVIRONMENT: Development
        run: >
          dotnet test backend/tests/MedicalPortal.Tests/MedicalPortal.Tests.csproj
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=test_results.trx"
          -- -parallel none

      - name: Publish Test Results
        uses: actions/upload-artifact@v4.3.1
        if: always()
        with:
          name: test-results-and-coverage
          path: ./TestResults

  # =========================================================================
  # 3. DEPENDENCY VULNERABILITY SCAN
  # =========================================================================
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.2.2

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Check Vulnerable NuGet Packages
        run: |
          vuln_output=$(dotnet list backend/MedicalPortal.sln package --vulnerable --include-transitive)
          echo "$vuln_output"
          if echo "$vuln_output" | grep -qi "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages detected in solution!"
            exit 1
          fi

      - name: Run Trivy Filesystem Dependency Scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # =========================================================================
  # 4. CONTAINER IMAGE SECURITY SCAN
  # =========================================================================
  container-scan:
    name: Container Image Build & Security Scan
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.2.2

      - name: Build Production Docker Image
        run: docker build -t medical-portal:${{ github.sha }} .

      - name: Run Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: 'medical-portal:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # =========================================================================
  # 5. SECRET SCANNING (ZERO CREDENTIAL LEAKS)
  # =========================================================================
  secret-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
