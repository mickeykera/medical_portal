name: CI / Production Readiness Pipeline

on:
  push:
    branches: [ "main", "Main" ]
  pull_request:
    branches: [ "main", "Main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # =========================================================================
  # 1. BUILD & AUTOMATED TEST SUITE WITH CODE COVERAGE
  # =========================================================================
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: medical_portal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medical_portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore backend/MedicalPortal.sln

      - name: Build Solution (Release)
        run: dotnet build backend/MedicalPortal.sln --configuration Release --no-restore

      - name: Run Unit & Integration Tests with Coverage
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medical_portal_test
          REDIS_CONNECTION_STRING: localhost:6379
          JWT_SECRET: ThisIsACISecretKeyWithAtLeast32BytesLength1234567!
          ASPNETCORE_ENVIRONMENT: Development
        run: >
          dotnet test backend/tests/MedicalPortal.Tests/MedicalPortal.Tests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=test_results.trx"

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-and-coverage
          path: ./TestResults

  # =========================================================================
  # 2. DEPENDENCY VULNERABILITY SCAN
  # =========================================================================
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check Vulnerable NuGet Packages
        run: dotnet list backend/MedicalPortal.sln package --vulnerable --include-transitive

      - name: Run Trivy Filesystem Dependency Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # =========================================================================
  # 3. CONTAINER IMAGE SECURITY SCAN
  # =========================================================================
  container-scan:
    name: Container Image Build & Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Production Docker Image
        run: docker build -t medical-portal:${{ github.sha }} .

      - name: Run Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'medical-portal:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # =========================================================================
  # 4. SECRET SCANNING (ZERO CREDENTIAL LEAKS)
  # =========================================================================
  secret-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
