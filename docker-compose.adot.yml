version: '3.8'

# =============================================================================
# Dedicated On-Premises Deployment: Adot Internal Medicine (Adot-Hospital)
# Architecture: Single-Tenant Dedicated Database & Clinical Core (OpenMRS)
# =============================================================================

services:
  # Isolated PostgreSQL Database Engine (Port 5432 isolated on adot-portal-internal)
  adot-postgres:
    image: postgres:17-alpine
    container_name: adot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: adot_portal_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ADOT_POSTGRES_ROOT_PASSWORD:-adot_postgres_root_secret}
    volumes:
      - adot_pg_data:/var/lib/postgresql/data
      - ./scripts/init-adot-db.sql:/docker-entrypoint-initdb.d/01-init-adot-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adot_portal_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - adot-portal-internal

  # Isolated Redis Cache & PubSub
  adot-redis:
    image: redis:7-alpine
    container_name: adot-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - adot_redis_data:/data
    networks:
      - adot-portal-internal

  # Medical Portal Backend: Dedicated Instance for Adot Internal Medicine
  adot-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adot-backend
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - FORWARDED_HEADERS_TRUSTED_NETWORKS=172.16.0.0/12,10.0.0.0/8,127.0.0.1/32
      - ConnectionStrings__DefaultConnection=Host=adot-postgres;Port=5432;Database=adot_portal_db;Username=adot_portal_app;Password=${ADOT_PORTAL_DB_PASSWORD:-adot_portal_secure_pass};
      - REDIS_CONNECTION_STRING=adot-redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - FieldEncryption__Keys__0__Version=v1
      - FieldEncryption__Keys__0__KeyHex=${FIELD_ENCRYPTION_KEY_HEX}
      - TENANT_SLUG=Adot-Hospital
      - HOSPITAL_HOST_DOMAIN=${HOSPITAL_HOST_DOMAIN:-portal.adot.et}
      - HMS_BASE_URL=${HMS_BASE_URL:-https://hms.adot.et/api}
      - HMS_WEBHOOK_SECRET=${HMS_WEBHOOK_SECRET}
      - Clinical__OpenMrs__BaseUrl=${OPENMRS_BASE_URL:-http://adot-openmrs:8080/openmrs}
      - Echis__Enabled=true
      - Dhis2__BaseUrl=${DHIS2_BASE_URL:-https://dhis2.moh.gov.et}
    depends_on:
      adot-postgres:
        condition: service_healthy
      adot-redis:
        condition: service_healthy
    volumes:
      - adot_backend_data:/app/data
    networks:
      adot-portal-internal:
        aliases:
          - backend

  # Same-Origin Reverse Proxy & Frontend Static File Host
  adot-proxy:
    image: nginx:alpine
    container_name: adot-proxy
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - adot-backend
    networks:
      - adot-portal-internal

networks:
  adot-portal-internal:
    name: adot-portal-internal
    driver: bridge

volumes:
  adot_pg_data:
  adot_redis_data:
  adot_backend_data:
