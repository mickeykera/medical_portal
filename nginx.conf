upstream medical_portal_cluster {
    # Round-robin distribution across clustered application instances
    server medical-portal-1:8080;
    server medical-portal-2:8080;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://medical_portal_cluster;
        proxy_http_version 1.1;

        # Preserves client IP identity for trusted proxy verification and rate-limiting
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Real-time WebSockets and SignalR hub connectivity
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
