upstream medical_portal_backend {
    # Application backend instances reachable on internal Docker network
    server backend:8080;
}

server {
    listen 80;
    server_name localhost;

    # Static frontend Single Page Application (same-origin delivery)
    root /usr/share/nginx/html;
    index index.html;

    # Client-side SPA routing: serve static assets directly or fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API endpoints reverse-proxied to internal backend
    location /api/ {
        proxy_pass http://medical_portal_backend;
        proxy_http_version 1.1;

        # Forwarded identity headers for trusted proxy resolution
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Real-time WebSockets and SignalR hub connectivity
    location /hubs/ {
        proxy_pass http://medical_portal_backend;
        proxy_http_version 1.1;

        # WebSocket protocol upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # HL7 FHIR R4 JSON REST endpoints
    location /R4/ {
        proxy_pass http://medical_portal_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Application liveness and readiness health probes
    location /health {
        proxy_pass http://medical_portal_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Swagger interactive API documentation
    location /swagger/ {
        proxy_pass http://medical_portal_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
