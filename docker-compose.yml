services:
  # Relational Database: PostgreSQL 17 Alpine (isolated on internal Docker network)
  postgres:
    image: postgres:17-alpine
    container_name: medical-portal-postgres
    restart: unless-stopped
    # Host port 5432 removed to prevent external database access; reachable only within portal-internal
    environment:
      POSTGRES_DB: medical_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medical_portal"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - portal-internal

  # ---------------------------------------------------------------------------
  # Development Profile (docker compose up -d or docker compose --profile dev up -d)
  # Standalone single-instance deployment enabling fake external service providers explicitly.
  # ---------------------------------------------------------------------------
  medical-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-portal-app
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    profiles: ["dev"]
    # Host port 5000 removed; traffic enters via the same-origin Nginx proxy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - Kestrel__Endpoints__Http__Url=http://+:8080
      - FORWARDED_HEADERS_TRUSTED_NETWORKS=172.16.0.0/12,10.0.0.0/8,127.0.0.1/32
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=medical_portal;Username=postgres;Password=postgres;
      # Fake providers enabled explicitly for safe offline / local development
      - Stripe__UseFake=true
      - STRIPE_USE_FAKE=true
      - Hms__UseFake=true
      - HMS_USE_FAKE=true
      - JWT_SECRET=${JWT_SECRET:-}
      - DEV_SEED_PASSWORD=${DEV_SEED_PASSWORD:-}
      - DEV_TOTP_SECRET=${DEV_TOTP_SECRET:-}
      - DEV_QUICK_LOGIN=${DEV_QUICK_LOGIN:-true}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - portal_data:/app/data
    networks:
      portal-internal:
        aliases:
          - backend

  # ---------------------------------------------------------------------------
  # Multi-Instance Clustered Production Profile (docker compose --profile cluster up -d)
  # Enforces fail-closed production guards, real Redis state, and required secrets.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: medical-portal-redis
    restart: unless-stopped
    profiles: ["cluster", "production"]
    # Host port 6379 removed to prevent external cache access; reachable only within portal-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - portal-internal

  medical-portal-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-portal-app-1
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    profiles: ["cluster", "production"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - Kestrel__Endpoints__Http__Url=http://+:8080
      - FORWARDED_HEADERS_TRUSTED_NETWORKS=172.16.0.0/12,10.0.0.0/8,127.0.0.1/32
      - REDIS_CONNECTION_STRING=redis:6379
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=medical_portal;Username=postgres;Password=postgres;
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required in production profile}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required in production profile}
      - HMS_WEBHOOK_SECRET=${HMS_WEBHOOK_SECRET:?HMS_WEBHOOK_SECRET is required in production profile}
      - HMS_BASE_URL=${HMS_BASE_URL:?HMS_BASE_URL is required in production profile}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - portal_cluster_data_1:/app/data
    networks:
      portal-internal:
        aliases:
          - backend

  medical-portal-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-portal-app-2
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    profiles: ["cluster", "production"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - Kestrel__Endpoints__Http__Url=http://+:8080
      - FORWARDED_HEADERS_TRUSTED_NETWORKS=172.16.0.0/12,10.0.0.0/8,127.0.0.1/32
      - REDIS_CONNECTION_STRING=redis:6379
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=medical_portal;Username=postgres;Password=postgres;
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required in production profile}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required in production profile}
      - HMS_WEBHOOK_SECRET=${HMS_WEBHOOK_SECRET:?HMS_WEBHOOK_SECRET is required in production profile}
      - HMS_BASE_URL=${HMS_BASE_URL:?HMS_BASE_URL is required in production profile}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - portal_cluster_data_2:/app/data
    networks:
      portal-internal:
        aliases:
          - backend

  # Same-Origin Reverse Proxy and Frontend Static File Host
  proxy:
    image: nginx:alpine
    container_name: medical-portal-proxy
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portal-internal

networks:
  portal-internal:
    name: portal-internal
    driver: bridge

volumes:
  pg_data:
  portal_data:
  portal_cluster_data_1:
  portal_cluster_data_2:
